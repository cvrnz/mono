[workspace]
resolver = "2"
members = ["crates/core", "crates/agent", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
monomyth-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.agent]
inherits = "release"
opt-level = "z"
panic = "abort"
