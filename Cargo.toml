[workspace]
resolver = "2"
members = ["crates/core", "crates/agent", "crates/host", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
mono-core = { path = "crates/core" }
mono-host = { path = "crates/host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"

# Release builds are the installed app: fat LTO and one codegen unit keep the bundle small
# (16.5 MB, against 20.1 MB without them), at the cost of slower builds.
[profile.release]
codegen-units = 1
lto = true
strip = true

# The container helper is copied into every container, so it stays as small as possible.
[profile.agent]
inherits = "release"
opt-level = "z"
panic = "abort"
