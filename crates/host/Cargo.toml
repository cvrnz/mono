[package]
name = "mono-host"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mono-host"
path = "src/main.rs"

[dependencies]
mono-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "net", "macros", "rt-multi-thread", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono", "winauth"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.43", features = ["bundled"] }
